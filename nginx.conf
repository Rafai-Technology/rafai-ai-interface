server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy the agent service so the browser stays on one origin: no CORS, and
  # the bearer token never crosses an origin boundary. AGENT_URL is substituted
  # at container start, so one image serves every environment.
  location /api/ {
    proxy_pass         ${AGENT_URL}/;
    proxy_set_header   Host ${DOLLAR}host;
    proxy_set_header   X-Real-IP ${DOLLAR}remote_addr;
    # Answers can take a while — the model is the slow part, not the database.
    proxy_read_timeout 120s;
  }

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # leaves browsers on the old bundle.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-store"; }
  # The brand is rewritten at container start (brand.sh). Revalidated on every
  # load, so restarting with new BRAND_* values reaches browsers immediately.
  location = /brand.js { add_header Cache-Control "no-cache"; charset utf-8; }

  location / { try_files ${DOLLAR}uri ${DOLLAR}uri/ /index.html; }
}
